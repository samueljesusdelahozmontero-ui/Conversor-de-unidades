<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversor de unidades</title>
<link rel="stylesheet" href="styles.css"></head><body>
<main><h1>Conversor SI → inglés</h1>
<label for="tipo">Conversión</label>
<select id="tipo"><option value="m">Metros a pies</option>
<option value="cm">Centímetros a pulgadas</option>
<option value="km">Kilómetros a millas</option>
<option value="kg">Kilogramos a libras</option></select>
<label for="cantidad">Cantidad</label>
<input id="cantidad" type="number" step="any" placeholder="Ej. 2.5">
<button id="convertir">Convertir</button>
<p id="resultado" role="status" aria-live="polite"></p>
</main><script src="script.js"></script></body></html>
